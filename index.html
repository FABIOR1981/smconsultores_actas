<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Actas</title>
    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/estilo.css">
    
    <!-- Librerías para exportar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div class="contenedor-principal">
        <!-- PANEL IZQUIERDO: EDICIÓN -->
        <aside class="panel-edicion no-print">
            <h2>Edición de Datos</h2>
            
            <div class="grupo-input">
                <label>Fecha</label>
                <input type="text" id="input-fecha" value="05/10/2026">
            </div>
            <div class="grupo-input">
                <label>Título Acta</label>
                <input type="text" id="input-titulo" value="Acta de Reunión">
            </div>
            <div class="grupo-input">
                <label>Consultoría</label>
                <input type="text" id="input-consultoria" value="SM Consultores">
            </div>
            <div class="grupo-input">
                <label>Proceso</label>
                <input type="text" id="input-proceso" value="Operaciones">
            </div>
            <div class="grupo-input">
                <label>Elaborado por</label>
                <input type="text" id="input-elabora" value="Lic. Shalon Morales">
            </div>

            <hr>
            
            <div class="seccion-listas">
                <h3>Temas Tratados <button onclick="agregarItem('temas')">+</button></h3>
                <div id="editor-temas"></div>
            </div>

            <div class="seccion-listas">
                <h3>Pendientes <button onclick="agregarItem('pendientes')">+</button></h3>
                <div id="editor-pendientes"></div>
            </div>

            <div class="seccion-listas">
                <h3>Acciones Próximo Encuentro <button onclick="agregarItem('acciones')">+</button></h3>
                <div id="editor-acciones"></div>
            </div>

            <div class="botones-exportar">
                <button onclick="exportarJPEG()">Exportar JPEG</button>
                <button onclick="exportarPDF()">Exportar PDF</button>
            </div>
        </aside>

        <!-- PANEL DERECHO: VISTA PREVIA A4 -->
        <main class="panel-vista">
            <div id="caja-preview">
                <div id="escala" style="width: 1545px; height: 2183px;">
                    <div id="acta-preview" class="acta">
                        
                        <!-- TUS PNGs DIRECTO DE LA CARPETA img/ -->
                        <img id="img-deco-titulo" class="acta-deco-img deco-titulo" src="img/garabato_1_2.png" alt="Adorno Título">
                        <img id="img-deco-temas" class="acta-deco-img deco-temas" src="img/garabato_2_2.png" alt="Adorno Temas">
                        <img id="img-deco-pendientes" class="acta-deco-img deco-pendientes" src="img/garabato_3_2.png" alt="Adorno Pendientes">
                        <img id="img-deco-acciones" class="acta-deco-img deco-acciones" src="img/garabato_4_2.png" alt="Adorno Acciones">

                        <div class="acta-cab">
                            <h1 class="acta-titulo" id="out-titulo">Acta de Reunión</h1>
                            <div class="acta-meta">
                                <p><strong>Fecha:</strong> <span id="out-fecha">05/10/2026</span></p>
                                <p><strong>Consultoría:</strong> <span id="out-consultoria">SM Consultores</span></p>
                                <p><strong>Proceso:</strong> <span id="out-proceso">Operaciones</span></p>
                            </div>
                        </div>

                        <div class="sec sec-1">
                            <div class="sec-et">Temas Tratados</div>
                            <ul id="out-temas"></ul>
                        </div>
                        <div class="sec sec-2">
                            <div class="sec-et">Pendientes a realizar</div>
                            <ul id="out-pendientes"></ul>
                        </div>
                        <div class="sec sec-3">
                            <div class="sec-et">Acciones acordadas<br>próximo encuentro</div>
                            <ul id="out-acciones"></ul>
                        </div>

                        <div class="acta-pie">
                            Elaborado por: <span id="out-elabora">Lic. Shalon Morales</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Tu script -->
    <script src="js/script.js"></script>
</body>
</html>
